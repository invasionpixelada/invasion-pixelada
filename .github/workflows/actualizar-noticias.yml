name: Actualizar noticias

on:
  schedule:
    # Ejecutar cada hora
    - cron: "0 * * * *"

  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:

  actualizar-noticias:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =====================================================
      # 1. DESCARGAR REPOSITORIO
      # =====================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # =====================================================
      # 2. DESCARGAR RSS DE UVEJUEGOS
      # =====================================================

      - name: Descargar RSS de uVeJuegos
        run: |

          curl -L \
            --fail \
            --silent \
            --show-error \
            "https://uvejuegos.com/contenidosRSS.jsp" \
            -o noticias-rss.xml

          echo "RSS descargado."

          echo ""
          echo "Tamaño del archivo:"
          wc -c noticias-rss.xml


      # =====================================================
      # 3. ANALIZAR EL RSS
      # =====================================================

      - name: Analizar contenido del RSS
        run: |

          python3 <<'PY'

          import xml.etree.ElementTree as ET
          import html
          import re


          RSS_FILE = "noticias-rss.xml"


          # =====================================================
          # FUNCIONES
          # =====================================================

          def limpiar_texto(texto):

              if not texto:
                  return ""

              texto = html.unescape(texto)

              texto = re.sub(
                  r"<[^>]+>",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # LEER RSS
          # =====================================================

          arbol = ET.parse(
              RSS_FILE
          )

          raiz = arbol.getroot()

          canal = raiz.find(
              "channel"
          )


          if canal is None:

              raise Exception(
                  "No se ha encontrado el canal RSS."
              )


          items = canal.findall(
              "item"
          )


          print("")
          print("====================================")
          print("ANÁLISIS COMPLETO DEL RSS")
          print("====================================")

          print(
              f"Noticias totales encontradas: {len(items)}"
          )


          # =====================================================
          # MOSTRAR TODAS LAS NOTICIAS
          # =====================================================

          for numero, item in enumerate(
              items,
              start=1
          ):

              titulo = limpiar_texto(
                  item.findtext(
                      "title",
                      ""
                  )
              )


              descripcion = limpiar_texto(
                  item.findtext(
                      "description",
                      ""
                  )
              )


              categoria = limpiar_texto(
                  item.findtext(
                      "category",
                      ""
                  )
              )


              enlace = (
                  item.findtext(
                      "link",
                      ""
                  )
                  .strip()
              )


              fecha = (
                  item.findtext(
                      "pubDate",
                      ""
                  )
                  .strip()
              )


              print("")
              print("====================================")
              print(
                  f"NOTICIA {numero}"
              )
              print("====================================")

              print("")
              print(
                  f"TÍTULO: {titulo}"
              )

              print("")
              print(
                  f"CATEGORÍA: {categoria}"
              )

              print("")
              print(
                  f"FECHA: {fecha}"
              )

              print("")
              print(
                  "DESCRIPCIÓN:"
              )

              if descripcion:

                  print(
                      descripcion[:2000]
                  )

              else:

                  print(
                      "[SIN DESCRIPCIÓN]"
                  )

              print("")
              print(
                  f"ENLACE: {enlace}"
              )


          print("")
          print("====================================")
          print("FIN DEL ANÁLISIS")
          print("====================================")


          PY


      # =====================================================
      # 4. NO MODIFICAR noticias.json TODAVÍA
      # =====================================================

      - name: Estado de noticias.json
        run: |

          echo "===================================="
          echo "ESTADO ACTUAL DE noticias.json"
          echo "===================================="

          if [ -f noticias.json ]; then

              cat noticias.json

          else

              echo "El archivo noticias.json todavía no existe."

          fi
