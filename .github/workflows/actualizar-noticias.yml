name: Actualizar noticias

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  actualizar-noticias:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # DESCARGAR REPOSITORIO
      # =====================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # =====================================================
      # CONFIGURAR PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # =====================================================
      # INSTALAR DEPENDENCIAS
      # =====================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # =====================================================
      # LEER RSS Y CREAR noticias.json
      # =====================================================

      - name: Actualizar noticias
        run: |

          python <<'PY'

          import json
          import re
          import requests

          from bs4 import BeautifulSoup
          from xml.etree import ElementTree as ET


          # =================================================
          # CONFIGURACIÓN
          # =================================================

          RSS_URL = "https://uvejuegos.com/rss"

          ARCHIVO_SALIDA = "noticias.json"

          MAX_NOTICIAS_RSS = 20


          # =================================================
          # PALABRAS RELACIONADAS CON LA WEB
          # =================================================

          PALABRAS = {

              "aventura gráfica": 10,
              "aventura grafica": 10,

              "point & click": 10,
              "point and click": 10,
              "point-and-click": 10,

              "visual novel": 9,
              "visual novels": 9,
              "novela visual": 9,

              "walking simulator": 8,
              "walking simulators": 8,

              "narrativo": 6,
              "narrativa": 6,
              "videojuego narrativo": 8,

              "aventura cooperativa": 5,

              "misterio": 5,
              "detective": 5,
              "investigación": 5,
              "investigacion": 5,

              "terror": 5,
              "horror": 5,

              "lovecraft": 6,
              "lovecraftiano": 6,

              "ciencia ficción": 5,
              "ciencia ficcion": 5,

              "thriller": 4,

              "puzles": 5,
              "puzzles": 5,

              "historia": 3,
              "historia del juego": 4,

              "personajes": 2,
              "guion": 5,
              "guión": 5,

              "rol narrativo": 4,

              "story driven": 5,
              "storytelling": 5
          }


          # =================================================
          # DESCARGAR RSS
          # =================================================

          print("Descargando RSS de uVeJuegos...")

          respuesta = requests.get(
              RSS_URL,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0 InvasionPixeladaBot/1.0"
              }
          )

          respuesta.raise_for_status()

          root = ET.fromstring(respuesta.content)


          # =================================================
          # LOCALIZAR ITEMS
          # =================================================

          items = root.findall(".//item")

          print(
              f"Noticias encontradas en RSS: {len(items)}"
          )


          noticias = []


          # =================================================
          # FUNCIONES
          # =================================================

          def limpiar_texto(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  texto,
                  "html.parser"
              )

              return soup.get_text(
                  " ",
                  strip=True
              )


          def obtener_imagen(url):

              if not url:
                  return ""


              try:

                  pagina = requests.get(
                      url,
                      timeout=20,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 "
                          "InvasionPixeladaBot/1.0"
                      }
                  )


                  if pagina.status_code != 200:
                      return ""


                  soup = BeautifulSoup(
                      pagina.text,
                      "html.parser"
                  )


                  # -----------------------------------------
                  # OG IMAGE
                  # -----------------------------------------

                  meta = soup.find(
                      "meta",
                      property="og:image"
                  )


                  if meta and meta.get("content"):

                      return meta["content"].strip()


                  # -----------------------------------------
                  # TWITTER IMAGE
                  # -----------------------------------------

                  meta = soup.find(
                      "meta",
                      attrs={
                          "name": "twitter:image"
                      }
                  )


                  if meta and meta.get("content"):

                      return meta["content"].strip()


                  return ""


              except Exception as error:

                  print(
                      "No se pudo obtener imagen:",
                      error
                  )

                  return ""


          def calcular_puntuacion(
              titulo,
              descripcion,
              categoria
          ):

              texto = (
                  titulo +
                  " " +
                  descripcion
              ).lower()


              puntuacion = 0


              for palabra, puntos in PALABRAS.items():

                  if palabra in texto:

                      puntuacion += puntos


              # -----------------------------------------
              # Categorías
              # -----------------------------------------

              categoria_lower = categoria.lower()


              if categoria_lower == "ps5":
                  puntuacion += 0


              if categoria_lower == "switch2":
                  puntuacion += 0


              return puntuacion


          # =================================================
          # PROCESAR NOTICIAS
          # =================================================

          for item in items[:MAX_NOTICIAS_RSS]:

              titulo = (
                  item.findtext("title") or ""
              ).strip()


              enlace = (
                  item.findtext("link") or ""
              ).strip()


              descripcion = limpiar_texto(
                  item.findtext("description") or ""
              )


              categoria = (
                  item.findtext("category") or ""
              ).strip()


              pub_date = (
                  item.findtext("pubDate") or ""
              ).strip()


              if not titulo or not enlace:
                  continue


              puntuacion = calcular_puntuacion(
                  titulo,
                  descripcion,
                  categoria
              )


              print("")
              print("------------------------------------")
              print("TÍTULO:", titulo)
              print("PUNTUACIÓN:", puntuacion)


              # -----------------------------------------
              # Guardamos solamente noticias relacionadas
              # -----------------------------------------

              if puntuacion <= 0:

                  print("DESCARTADA")

                  continue


              print("RELEVANTE")


              # -----------------------------------------
              # Obtener imagen
              # -----------------------------------------

              imagen = obtener_imagen(enlace)


              if imagen:

                  print(
                      "IMAGEN:",
                      imagen
                  )

              else:

                  print(
                      "IMAGEN: no encontrada"
                  )


              noticias.append({

                  "title": titulo,

                  "link": enlace,

                  "description": descripcion,

                  "category": categoria,

                  "pubDate": pub_date,

                  "image": imagen,

                  "score": puntuacion

              })


          # =================================================
          # ORDENAR
          # =================================================

          noticias.sort(
              key=lambda noticia:
                  noticia.get("pubDate", ""),
              reverse=True
          )


          # =================================================
          # LIMITAR RESULTADOS
          # =================================================

          noticias = noticias[:6]


          # =================================================
          # GUARDAR JSON
          # =================================================

          with open(
              ARCHIVO_SALIDA,
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  noticias,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =================================================
          # INFORMACIÓN FINAL
          # =================================================

          print("")
          print("====================================")
          print("RESULTADO FINAL")
          print("====================================")

          print(
              "Noticias guardadas:",
              len(noticias)
          )

          for noticia in noticias:

              print(
                  "-",
                  noticia["title"]
              )

          print(
              "Archivo:",
              ARCHIVO_SALIDA
          )

          PY


      # =====================================================
      # GUARDAR CAMBIOS EN GITHUB
      # =====================================================

      - name: Guardar noticias en GitHub
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit -m "Actualizar noticias"

          git push
