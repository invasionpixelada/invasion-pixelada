name: Actualizar noticias

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-noticias:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install requests feedparser beautifulsoup4

      - name: Descargar RSS de uVeJuegos y generar noticias.json
        run: |

          python <<'PY'

          import json
          import requests
          import feedparser
          from bs4 import BeautifulSoup


          print("====================================")
          print("ACTUALIZANDO NOTICIAS")
          print("====================================")


          # =========================================================
          # RSS DE UVEJUEGOS
          # =========================================================

          RSS_URL = "https://uvejuegos.com/contenidosRSS.jsp"

          print("")
          print("Descargando RSS de uVeJuegos...")
          print(RSS_URL)


          respuesta = requests.get(
              RSS_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=30
          )

          respuesta.raise_for_status()


          print("RSS descargado correctamente.")
          print("Código HTTP:", respuesta.status_code)


          # =========================================================
          # PROCESAR RSS
          # =========================================================

          feed = feedparser.parse(
              respuesta.content
          )


          print("")
          print("Elementos encontrados en el RSS:")
          print(len(feed.entries))


          noticias = []


          for entrada in feed.entries:

              titulo = entrada.get(
                  "title",
                  ""
              ).strip()


              enlace = entrada.get(
                  "link",
                  ""
              ).strip()


              descripcion = entrada.get(
                  "description",
                  ""
              ).strip()


              categoria = ""


              if "tags" in entrada:

                  categorias = []

                  for tag in entrada.tags:

                      termino = tag.get(
                          "term",
                          ""
                      )

                      if termino:
                          categorias.append(
                              termino
                          )

                  categoria = ", ".join(
                      categorias
                  )


              fecha = entrada.get(
                  "published",
                  entrada.get(
                      "pubDate",
                      ""
                  )
              )


              # Limpiar HTML de la descripción

              descripcion_limpia = BeautifulSoup(
                  descripcion,
                  "html.parser"
              ).get_text(
                  " ",
                  strip=True
              )


              noticia = {

                  "title": titulo,

                  "link": enlace,

                  "description":
                      descripcion_limpia,

                  "category":
                      categoria,

                  "pubDate":
                      fecha
              }


              noticias.append(
                  noticia
              )


          # =========================================================
          # GUARDAR JSON
          # =========================================================

          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  noticias,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("====================================")
          print("RESULTADO")
          print("====================================")

          print(
              "Noticias guardadas:",
              len(noticias)
          )

          print(
              "Archivo generado: noticias.json"
          )

          print("====================================")

          PY


      - name: Comprobar noticias.json
        run: |

          echo "Contenido de noticias.json:"
          echo "--------------------------------"

          cat noticias.json

          echo "--------------------------------"


      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || git commit -m "Actualizar noticias"

          git push
