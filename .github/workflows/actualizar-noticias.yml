name: Actualizar noticias

on:
  schedule:
    # Ejecutar cada hora
    - cron: "0 * * * *"

  # También permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:

  actualizar-noticias:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # 1. Descargar el repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4


      # 2. Descargar el RSS de uVeJuegos
      - name: Descargar RSS de uVeJuegos
        run: |
          curl -L \
            --fail \
            --silent \
            --show-error \
            "https://uvejuegos.com/contenidosRSS.jsp" \
            -o noticias-rss.xml


      # 3. Procesar el RSS y crear noticias.json
      - name: Generar noticias.json
        run: |

          python3 <<'PY'

          import xml.etree.ElementTree as ET
          import json
          import html
          import re


          RSS_FILE = "noticias-rss.xml"
          JSON_FILE = "noticias.json"


          # =====================================================
          # CONFIGURACIÓN
          # =====================================================

          NUMERO_MAXIMO_NOTICIAS = 30


          PALABRAS_FUERTES = [

              "aventura gráfica",
              "aventura grafica",
              "point & click",
              "point and click",
              "point-and-click",
              "point-and-click",
              "visual novel",
              "visual novels",
              "novela visual",
              "walking simulator",
              "walking simulators",
              "aventura narrativa",
              "aventuras narrativas",
              "juego narrativo",
              "juegos narrativos"

          ]


          PALABRAS_COMPLEMENTARIAS = [

              "lovecraft",
              "lovecraftiano",
              "misterio",
              "terror",
              "horror",
              "detective",
              "investigación",
              "investigacion",
              "puzles",
              "puzzles",
              "ciencia ficción",
              "ciencia ficcion",
              "thriller"

          ]


          PALABRAS_EXCLUIDAS = [

              "fifa",
              "ea sports",
              "call of duty",
              "fortnite",
              "pokemon go",
              "nintendo switch 2",
              "hardware",
              "consola",
              "mando",
              "comic-con",
              "merchandising"

          ]


          # =====================================================
          # FUNCIONES
          # =====================================================

          def limpiar_texto(texto):

              if not texto:
                  return ""

              texto = html.unescape(texto)

              texto = re.sub(
                  r"<[^>]+>",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          def normalizar(texto):

              return limpiar_texto(
                  texto
              ).lower()


          def obtener_texto_noticia(item):

              titulo = item.findtext(
                  "title",
                  ""
              )

              descripcion = item.findtext(
                  "description",
                  ""
              )

              categoria = item.findtext(
                  "category",
                  ""
              )

              return normalizar(
                  f"{titulo} {descripcion} {categoria}"
              )


          def es_relevante(item):

              texto = obtener_texto_noticia(
                  item
              )


              # ---------------------------------------------
              # Primero descartamos contenidos claramente
              # alejados de la temática.
              # ---------------------------------------------

              for palabra in PALABRAS_EXCLUIDAS:

                  if palabra in texto:
                      return False


              # ---------------------------------------------
              # Las palabras fuertes tienen prioridad.
              # ---------------------------------------------

              for palabra in PALABRAS_FUERTES:

                  if palabra in texto:
                      return True


              # ---------------------------------------------
              # Para las palabras complementarias exigimos
              # que haya al menos DOS coincidencias.
              #
              # Así evitamos que una noticia cualquiera que
              # simplemente mencione "historia" o "terror"
              # entre automáticamente.
              # ---------------------------------------------

              coincidencias = 0

              for palabra in PALABRAS_COMPLEMENTARIAS:

                  if palabra in texto:
                      coincidencias += 1


              return coincidencias >= 2


          # =====================================================
          # LEER RSS
          # =====================================================

          arbol = ET.parse(
              RSS_FILE
          )

          raiz = arbol.getroot()

          canal = raiz.find(
              "channel"
          )


          if canal is None:

              raise Exception(
                  "No se ha encontrado el canal RSS."
              )


          noticias = []


          # =====================================================
          # PROCESAR NOTICIAS
          # =====================================================

          for item in canal.findall("item"):

              if not es_relevante(item):
                  continue


              titulo = limpiar_texto(
                  item.findtext(
                      "title",
                      ""
                  )
              )


              enlace = (
                  item.findtext(
                      "link",
                      ""
                  )
                  .strip()
              )


              descripcion = limpiar_texto(
                  item.findtext(
                      "description",
                      ""
                  )
              )


              categoria = limpiar_texto(
                  item.findtext(
                      "category",
                      ""
                  )
              )


              fecha = (
                  item.findtext(
                      "pubDate",
                      ""
                  )
                  .strip()
              )


              if not titulo or not enlace:
                  continue


              noticias.append({

                  "title": titulo,

                  "link": enlace,

                  "description": descripcion,

                  "category": categoria,

                  "pubDate": fecha

              })


              if (
                  len(noticias)
                  >= NUMERO_MAXIMO_NOTICIAS
              ):
                  break


          # =====================================================
          # GUARDAR JSON
          # =====================================================

          with open(
              JSON_FILE,
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  noticias,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              f"Noticias encontradas: {len(noticias)}"
          )

          PY


      # 4. Comprobar qué se ha generado
      - name: Mostrar noticias generadas
        run: |
          echo "===================================="
          echo "NOTICIAS GENERADAS"
          echo "===================================="
          cat noticias.json


      # 5. Guardar los cambios en GitHub
      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit \
              -m "Actualizar noticias de uVeJuegos"

          git push
