name: Actualizar noticias

on:
  schedule:
    # Ejecutar cada hora
    - cron: "0 * * * *"

  # También permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:


jobs:

  actualizar-noticias:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:


      # =====================================================
      # 1. DESCARGAR EL REPOSITORIO
      # =====================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # =====================================================
      # 2. DESCARGAR RSS DE UVEJUEGOS
      # =====================================================

      - name: Descargar RSS de uVeJuegos
        run: |

          curl -L \
            --fail \
            --silent \
            --show-error \
            --user-agent "Mozilla/5.0" \
            "https://uvejuegos.com/contenidosRSS.jsp" \
            -o noticias-rss.xml

          echo ""
          echo "RSS descargado correctamente."
          echo ""

          echo "Tamaño del archivo:"
          wc -c noticias-rss.xml

          echo ""
          echo "Primeras líneas del RSS:"
          echo "===================================="

          head -20 noticias-rss.xml

          echo ""
          echo "===================================="


      # =====================================================
      # 3. MOSTRAR LOS TITULARES DEL RSS
      # =====================================================

      - name: Mostrar titulares del RSS
        run: |

          echo ""
          echo "===================================="
          echo "TÍTULOS DEL RSS DE UVEJUEGOS"
          echo "===================================="

          python3 <<'PY'

          import xml.etree.ElementTree as ET


          RSS_FILE = "noticias-rss.xml"


          arbol = ET.parse(
              RSS_FILE
          )


          raiz = arbol.getroot()


          canal = raiz.find(
              "channel"
          )


          if canal is None:

              raise Exception(
                  "No se ha encontrado el elemento <channel>."
              )


          items = canal.findall(
              "item"
          )


          print(
              f"Total de elementos encontrados: {len(items)}"
          )


          print("")


          for numero, item in enumerate(
              items,
              1
          ):

              titulo = item.findtext(
                  "title",
                  ""
              )


              fecha = item.findtext(
                  "pubDate",
                  ""
              )


              categoria = item.findtext(
                  "category",
                  ""
              )


              print(
                  f"{numero}. {titulo}"
              )

              print(
                  f"   Categoría: {categoria}"
              )

              print(
                  f"   Fecha: {fecha}"
              )

              print("")


          PY

          echo "===================================="
          echo "FIN DE LOS TITULARES"
          echo "===================================="


      # =====================================================
      # 4. GENERAR noticias.json
      # =====================================================

      - name: Generar noticias.json
        run: |

          python3 <<'PY'

          import xml.etree.ElementTree as ET
          import json
          import html
          import re


          RSS_FILE = "noticias-rss.xml"
          JSON_FILE = "noticias.json"


          # =====================================================
          # CONFIGURACIÓN
          # =====================================================

          NUMERO_MAXIMO_NOTICIAS = 30


          PALABRAS_FUERTES = [

              "aventura gráfica",
              "aventura grafica",
              "aventuras gráficas",
              "aventuras graficas",

              "point & click",
              "point and click",
              "point-and-click",

              "visual novel",
              "visual novels",
              "novela visual",
              "novelas visuales",

              "walking simulator",
              "walking simulators",

              "aventura narrativa",
              "aventuras narrativas",

              "juego narrativo",
              "juegos narrativos",

              "videojuego narrativo",
              "videojuegos narrativos"

          ]


          PALABRAS_COMPLEMENTARIAS = [

              "lovecraft",
              "lovecraftiano",

              "misterio",

              "terror",
              "horror",

              "detective",

              "investigación",
              "investigacion",

              "puzles",
              "puzzles",

              "ciencia ficción",
              "ciencia ficcion",

              "thriller"

          ]


          PALABRAS_EXCLUIDAS = [

              "fifa",
              "ea sports",
              "call of duty",
              "fortnite",
              "pokemon go",

              "hardware",

              "comic-con",
              "merchandising"

          ]


          # =====================================================
          # LIMPIAR TEXTO
          # =====================================================

          def limpiar_texto(texto):

              if not texto:
                  return ""


              texto = html.unescape(
                  texto
              )


              texto = re.sub(
                  r"<[^>]+>",
                  " ",
                  texto
              )


              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )


              return texto.strip()


          # =====================================================
          # NORMALIZAR TEXTO
          # =====================================================

          def normalizar(texto):

              return limpiar_texto(
                  texto
              ).lower()


          # =====================================================
          # OBTENER TEXTO DE UNA NOTICIA
          # =====================================================

          def obtener_texto_noticia(item):

              titulo = item.findtext(
                  "title",
                  ""
              )


              descripcion = item.findtext(
                  "description",
                  ""
              )


              categoria = item.findtext(
                  "category",
                  ""
              )


              return normalizar(
                  f"{titulo} {descripcion} {categoria}"
              )


          # =====================================================
          # COMPROBAR SI ES RELEVANTE
          # =====================================================

          def es_relevante(item):

              texto = obtener_texto_noticia(
                  item
              )


              # ---------------------------------------------
              # DESCARTES
              # ---------------------------------------------

              for palabra in PALABRAS_EXCLUIDAS:

                  if palabra in texto:

                      return False


              # ---------------------------------------------
              # PALABRAS FUERTES
              # ---------------------------------------------

              for palabra in PALABRAS_FUERTES:

                  if palabra in texto:

                      return True


              # ---------------------------------------------
              # PALABRAS COMPLEMENTARIAS
              # ---------------------------------------------

              coincidencias = 0


              for palabra in PALABRAS_COMPLEMENTARIAS:

                  if palabra in texto:

                      coincidencias += 1


              return coincidencias >= 2


          # =====================================================
          # LEER RSS
          # =====================================================

          arbol = ET.parse(
              RSS_FILE
          )


          raiz = arbol.getroot()


          canal = raiz.find(
              "channel"
          )


          if canal is None:

              raise Exception(
                  "No se ha encontrado el canal RSS."
              )


          # =====================================================
          # PROCESAR NOTICIAS
          # =====================================================

          noticias = []


          total_items = 0


          relevantes = 0


          for item in canal.findall(
              "item"
          ):

              total_items += 1


              if not es_relevante(
                  item
              ):

                  continue


              relevantes += 1


              titulo = limpiar_texto(
                  item.findtext(
                      "title",
                      ""
                  )
              )


              enlace = (
                  item.findtext(
                      "link",
                      ""
                  )
                  .strip()
              )


              descripcion = limpiar_texto(
                  item.findtext(
                      "description",
                      ""
                  )
              )


              categoria = limpiar_texto(
                  item.findtext(
                      "category",
                      ""
                  )
              )


              fecha = (
                  item.findtext(
                      "pubDate",
                      ""
                  )
                  .strip()
              )


              if not titulo or not enlace:

                  continue


              noticias.append({

                  "title": titulo,

                  "link": enlace,

                  "description": descripcion,

                  "category": categoria,

                  "pubDate": fecha,

                  "source": "uVeJuegos"

              })


              if (
                  len(noticias)
                  >= NUMERO_MAXIMO_NOTICIAS
              ):

                  break


          # =====================================================
          # GUARDAR JSON
          # =====================================================

          with open(
              JSON_FILE,
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  noticias,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # RESULTADO
          # =====================================================

          print("")
          print("====================================")
          print("RESULTADO")
          print("====================================")

          print(
              f"Noticias totales en RSS: {total_items}"
          )

          print(
              f"Noticias relevantes: {relevantes}"
          )

          print(
              f"Noticias guardadas: {len(noticias)}"
          )

          print("====================================")


          PY


      # =====================================================
      # 5. MOSTRAR noticias.json
      # =====================================================

      - name: Mostrar noticias generadas
        run: |

          echo "===================================="
          echo "CONTENIDO DE noticias.json"
          echo "===================================="

          cat noticias.json

          echo ""

          echo "===================================="


      # =====================================================
      # 6. GUARDAR CAMBIOS EN GITHUB
      # =====================================================

      - name: Guardar cambios
        run: |

          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add noticias.json


          if git diff --cached --quiet; then

              echo "No hay cambios en noticias.json."

          else

              git commit \
                -m "Actualizar noticias de uVeJuegos"

              git push

          fi
