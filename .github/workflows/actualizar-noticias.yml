name: Actualizar noticias

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  actualizar-noticias:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # DESCARGAR REPOSITORIO
      # =========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # =========================================================
      # CONFIGURAR PYTHON
      # =========================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # =========================================================
      # INSTALAR DEPENDENCIAS
      # =========================================================

      - name: Instalar dependencias
        run: |
          pip install requests feedparser beautifulsoup4


      # =========================================================
      # DESCARGAR RSS Y GENERAR noticias.json
      # =========================================================

      - name: Descargar RSS de uVeJuegos y generar noticias.json
        run: |

          python <<'PY'

          import json
          import requests
          import feedparser

          from bs4 import BeautifulSoup
          from urllib.parse import urljoin


          print("========================================")
          print("ACTUALIZANDO NOTICIAS")
          print("========================================")


          # =====================================================
          # CONFIGURACIÓN
          # =====================================================

          RSS_URL = "https://uvejuegos.com/contenidosRSS.jsp"

          MAX_NOTICIAS = 30

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              )
          }


          # =====================================================
          # DESCARGAR RSS
          # =====================================================

          print("")
          print("Descargando RSS de uVeJuegos...")
          print(RSS_URL)


          respuesta = requests.get(
              RSS_URL,
              headers=HEADERS,
              timeout=30
          )


          respuesta.raise_for_status()


          print(
              "RSS descargado correctamente."
          )

          print(
              "Código HTTP:",
              respuesta.status_code
          )


          # =====================================================
          # PROCESAR RSS
          # =====================================================

          feed = feedparser.parse(
              respuesta.content
          )


          print("")
          print(
              "Elementos encontrados en el RSS:",
              len(feed.entries)
          )


          noticias = []


          # =====================================================
          # FUNCIÓN PARA BUSCAR IMAGEN
          # =====================================================

          def buscar_imagen(entrada, enlace, descripcion):

              imagen = ""


              # -------------------------------------------------
              # 1. media:content
              # -------------------------------------------------

              if hasattr(
                  entrada,
                  "media_content"
              ):

                  try:

                      for media in entrada.media_content:

                          url = media.get(
                              "url",
                              ""
                          )

                          if url:

                              imagen = url
                              break

                  except Exception:

                      pass


              # -------------------------------------------------
              # 2. media:thumbnail
              # -------------------------------------------------

              if not imagen and hasattr(
                  entrada,
                  "media_thumbnail"
              ):

                  try:

                      for media in entrada.media_thumbnail:

                          url = media.get(
                              "url",
                              ""
                          )

                          if url:

                              imagen = url
                              break

                  except Exception:

                      pass


              # -------------------------------------------------
              # 3. enclosure
              # -------------------------------------------------

              if not imagen and hasattr(
                  entrada,
                  "enclosures"
              ):

                  try:

                      for enclosure in entrada.enclosures:

                          url = enclosure.get(
                              "href",
                              enclosure.get(
                                  "url",
                                  ""
                              )
                          )

                          tipo = enclosure.get(
                              "type",
                              ""
                          )

                          if url and (
                              "image" in tipo
                              or url.lower().endswith(
                                  (
                                      ".jpg",
                                      ".jpeg",
                                      ".png",
                                      ".webp"
                                  )
                              )
                          ):

                              imagen = url
                              break

                  except Exception:

                      pass


              # -------------------------------------------------
              # 4. Campo image del RSS
              # -------------------------------------------------

              if not imagen and hasattr(
                  entrada,
                  "image"
              ):

                  try:

                      if isinstance(
                          entrada.image,
                          dict
                      ):

                          imagen = entrada.image.get(
                              "href",
                              entrada.image.get(
                                  "url",
                                  ""
                              )
                          )

                  except Exception:

                      pass


              # -------------------------------------------------
              # 5. Buscar <img> dentro de description
              # -------------------------------------------------

              if not imagen and descripcion:

                  try:

                      soup = BeautifulSoup(
                          descripcion,
                          "html.parser"
                      )

                      img = soup.find(
                          "img"
                      )

                      if img:

                          imagen = img.get(
                              "src",
                              ""
                          )

                  except Exception:

                      pass


              # -------------------------------------------------
              # 6. Si todavía no hay imagen,
              #    entrar en la noticia y buscar og:image
              # -------------------------------------------------

              if not imagen and enlace:

                  try:

                      print(
                          "Buscando imagen en:",
                          enlace
                      )


                      pagina = requests.get(
                          enlace,
                          headers=HEADERS,
                          timeout=20
                      )


                      if pagina.ok:

                          soup = BeautifulSoup(
                              pagina.text,
                              "html.parser"
                          )


                          # og:image
                          meta = soup.find(
                              "meta",
                              property="og:image"
                          )


                          if meta:

                              imagen = meta.get(
                                  "content",
                                  ""
                              )


                          # twitter:image
                          if not imagen:

                              meta = soup.find(
                                  "meta",
                                  attrs={
                                      "name":
                                      "twitter:image"
                                  }
                              )


                              if meta:

                                  imagen = meta.get(
                                      "content",
                                      ""
                                  )


                          # Primera imagen grande de la página
                          if not imagen:

                              for img in soup.find_all(
                                  "img"
                              ):

                                  src = img.get(
                                      "src",
                                      ""
                                  )

                                  if not src:
                                      continue


                                  src_lower = src.lower()


                                  if any(
                                      extension
                                      in src_lower
                                      for extension in (
                                          ".jpg",
                                          ".jpeg",
                                          ".png",
                                          ".webp"
                                      )
                                  ):

                                      imagen = src
                                      break


                  except Exception as error:

                      print(
                          "No se pudo obtener la imagen:",
                          error
                      )


              # -------------------------------------------------
              # Convertir URL relativa en absoluta
              # -------------------------------------------------

              if imagen:

                  imagen = urljoin(
                      enlace,
                      imagen
                  )


              return imagen


          # =====================================================
          # PROCESAR CADA NOTICIA
          # =====================================================

          for entrada in feed.entries[
              :MAX_NOTICIAS
          ]:

              titulo = entrada.get(
                  "title",
                  ""
              ).strip()


              enlace = entrada.get(
                  "link",
                  ""
              ).strip()


              descripcion = entrada.get(
                  "description",
                  ""
              ).strip()


              # -------------------------------------------------
              # CATEGORÍAS
              # -------------------------------------------------

              categoria = ""


              if "tags" in entrada:

                  categorias = []


                  for tag in entrada.tags:

                      termino = tag.get(
                          "term",
                          ""
                      ).strip()


                      if termino:

                          categorias.append(
                              termino
                          )


                  categoria = ", ".join(
                      categorias
                  )


              # -------------------------------------------------
              # FECHA
              # -------------------------------------------------

              fecha = entrada.get(
                  "published",
                  entrada.get(
                      "pubDate",
                      ""
                  )
              )


              # -------------------------------------------------
              # LIMPIAR DESCRIPCIÓN
              # -------------------------------------------------

              descripcion_limpia = BeautifulSoup(
                  descripcion,
                  "html.parser"
              ).get_text(
                  " ",
                  strip=True
              )


              # -------------------------------------------------
              # BUSCAR IMAGEN
              # -------------------------------------------------

              print("")
              print(
                  "----------------------------------------"
              )

              print(
                  "Procesando:",
                  titulo
              )


              imagen = buscar_imagen(
                  entrada,
                  enlace,
                  descripcion
              )


              if imagen:

                  print(
                      "Imagen encontrada:",
                      imagen
                  )

              else:

                  print(
                      "NO se encontró imagen."
                  )


              # -------------------------------------------------
              # CREAR NOTICIA
              # -------------------------------------------------

              noticia = {

                  "title":
                      titulo,

                  "link":
                      enlace,

                  "description":
                      descripcion_limpia,

                  "category":
                      categoria,

                  "pubDate":
                      fecha,

                  "image":
                      imagen
              }


              noticias.append(
                  noticia
              )


          # =====================================================
          # GUARDAR noticias.json
          # =====================================================

          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  noticias,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # RESULTADO
          # =====================================================

          print("")
          print("========================================")
          print("RESULTADO")
          print("========================================")

          print(
              "Noticias guardadas:",
              len(noticias)
          )

          print(
              "Archivo generado: noticias.json"
          )

          print("========================================")


          PY


      # =========================================================
      # COMPROBAR noticias.json
      # =========================================================

      - name: Comprobar noticias.json
        run: |

          echo "========================================"
          echo "CONTENIDO DE noticias.json"
          echo "========================================"

          cat noticias.json

          echo "========================================"


      # =========================================================
      # GUARDAR CAMBIOS
      # =========================================================

      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || git commit -m "Actualizar noticias"

          git push
