name: Generar tienda

on:
  push:
    paths:
      - "tienda/Libros.docx"
      - "tienda/Videojuegos.docx"
      - "tienda/Peliculas.docx"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install python-docx requests

      - name: Generar tienda
        run: |
          python generar_tienda.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tienda.html

          git diff --cached --quiet || git commit -m "Actualizar tienda automáticamente"

          git push
