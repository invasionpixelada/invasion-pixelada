name: Generar reseñas

on:
  push:
    paths:
      - "reseñas/**/*.docx"
      - "reseñas/**/*.jpg"
      - "reseñas/**/*.jpeg"
      - "reseñas/**/*.png"
      - "reseñas/**/*.webp"
      - "generar_resenas.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install python-docx

      - name: Generar reseñas
        run: |
          python generar_resenas.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reseñas index.html resenas.html sitemap.xml
          git diff --cached --quiet || git commit -m "Generar reseñas automáticamente"
          git push
