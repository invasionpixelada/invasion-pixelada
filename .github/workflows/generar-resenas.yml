name: Generar reseñas

on:
  push:
    paths:
      - "reseñas/**/*.docx"
      - "reseñas/**/*.jpg"
      - "reseñas/**/*.jpeg"
      - "reseñas/**/*.png"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install python-docx

      - name: Generar páginas de reseñas
        run: python generar_resenas.py

      - name: Guardar páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reseñas
          git diff --cached --quiet || git commit -m "Generar reseñas automáticamente"
          git push
