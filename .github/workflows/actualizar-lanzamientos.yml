name: Actualizar lanzamientos

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lanzamientos:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Obtener próximos lanzamientos de GOG
        run: |

          python <<'PY'

          import json
          import requests
          from datetime import datetime


          print("====================================")
          print("ACTUALIZANDO PRÓXIMOS LANZAMIENTOS")
          print("====================================")


          # =========================================================
          # CATÁLOGO DE GOG
          # =========================================================

          URL = (
              "https://catalog.gog.com/v1/catalog"
              "?limit=100"
              "&releaseStatuses=in%3Aupcoming"
              "&order=asc%3AreleaseDate"
              "&productType=in%3Agame"
              "&page=1"
          )


          print("")
          print("Consultando catálogo de GOG...")
          print(URL)


          respuesta = requests.get(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=30
          )


          respuesta.raise_for_status()


          datos = respuesta.json()


          print("")
          print(
              "Código HTTP:",
              respuesta.status_code
          )


          # =========================================================
          # COMPROBAR ESTRUCTURA
          # =========================================================

          productos = datos.get(
              "products",
              []
          )


          print(
              "Productos encontrados:",
              len(productos)
          )


          # =========================================================
          # DIAGNÓSTICO DE LA ESTRUCTURA REAL DE GOG
          # =========================================================

          if productos:

              print("")
              print("====================================")
              print("EJEMPLO DE PRODUCTO GOG")
              print("====================================")

              print(
                  json.dumps(
                      productos[0],
                      ensure_ascii=False,
                      indent=2
                  )
              )

              print("====================================")


          # =========================================================
          # PALABRAS CLAVE MUY ESPECÍFICAS
          # =========================================================

          PALABRAS_CLAVE = [

              "point & click",
              "point and click",
              "point-and-click",

              "graphic adventure",
              "graphic adventures",

              "visual novel",
              "visual novels",

              "walking simulator",
              "walking simulators",

              "narrative adventure",
              "narrative adventures",

              "story rich"

          ]


          # =========================================================
          # CATEGORÍAS QUE NO QUEREMOS USAR COMO FILTRO
          # =========================================================

          EXCLUSIONES = [

              "first-person shooter",
              "fps",
              "third-person shooter",
              "shooter",
              "battle royale",
              "racing",
              "sports",
              "strategy",
              "real-time strategy",
              "rpg",
              "role-playing",
              "fighting",
              "platformer"

          ]


          juegos = []


          # =========================================================
          # PROCESAR PRODUCTOS
          # =========================================================

          for producto in productos:

              titulo = str(
                  producto.get(
                      "title",
                      ""
                  )
              ).strip()


              if not titulo:
                  continue


              # -----------------------------------------------------
              # Convertimos el producto completo a texto.
              #
              # Esto permite encontrar etiquetas y categorías
              # aunque GOG cambie ligeramente la estructura.
              # -----------------------------------------------------

              texto = json.dumps(
                  producto,
                  ensure_ascii=False
              ).lower()


              # -----------------------------------------------------
              # FILTRO DE EXCLUSIÓN
              # -----------------------------------------------------

              if any(
                  exclusion in texto
                  for exclusion in EXCLUSIONES
              ):
                  continue


              # -----------------------------------------------------
              # FILTRO TEMÁTICO
              # -----------------------------------------------------

              coincide = any(
                  palabra in texto
                  for palabra in PALABRAS_CLAVE
              )


              if not coincide:
                  continue


              # -----------------------------------------------------
              # URL
              # -----------------------------------------------------

              enlace = ""


              enlaces = producto.get(
                  "_links",
                  {}
              )


              if isinstance(
                  enlaces,
                  dict
              ):

                  store = enlaces.get(
                      "store"
                  )

                  if isinstance(
                      store,
                      dict
                  ):

                      enlace = store.get(
                          "href",
                          ""
                      )


              # -----------------------------------------------------
              # IMAGEN
              # -----------------------------------------------------

              imagen = ""


              imagenes = producto.get(
                  "_links",
                  {}
              )


              if isinstance(
                  imagenes,
                  dict
              ):

                  boxart = imagenes.get(
                      "boxArtImage"
                  )

                  if isinstance(
                      boxart,
                      dict
                  ):

                      imagen = boxart.get(
                          "href",
                          ""
                      )


              # -----------------------------------------------------
              # FECHA
              # -----------------------------------------------------

              fecha = (
                  producto.get(
                      "releaseDate"
                  )
                  or
                  producto.get(
                      "release_date"
                  )
                  or
                  ""
              )


              # -----------------------------------------------------
              # EVITAR DUPLICADOS
              # -----------------------------------------------------

              if any(
                  juego["title"].lower()
                  == titulo.lower()
                  for juego in juegos
              ):
                  continue


              juegos.append({

                  "title":
                      titulo,

                  "link":
                      enlace,

                  "image":
                      imagen,

                  "releaseDate":
                      fecha,

                  "category":
                      "GOG"

              })


          # =========================================================
          # LIMITAR RESULTADOS
          # =========================================================

          juegos = juegos[:12]


          # =========================================================
          # GUARDAR
          # =========================================================

          with open(
              "proximos.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  juegos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # RESULTADO
          # =========================================================

          print("")
          print("====================================")
          print("RESULTADO")
          print("====================================")

          print(
              "Juegos seleccionados:",
              len(juegos)
          )

          print(
              "Archivo generado: proximos.json"
          )

          print("")


          for juego in juegos:

              print(
                  "--------------------------------"
              )

              print(
                  "Título:",
                  juego["title"]
              )

              print(
                  "Fecha:",
                  juego["releaseDate"]
              )

              print(
                  "Imagen:",
                  juego["image"]
              )

              print(
                  "Enlace:",
                  juego["link"]
              )


          print("")
          print("====================================")

          PY


      - name: Comprobar proximos.json
        run: |

          echo "===================================="
          echo "CONTENIDO DE proximos.json"
          echo "===================================="

          cat proximos.json

          echo ""
          echo "===================================="


      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proximos.json

          git diff --cached --quiet || git commit -m "Actualizar próximos lanzamientos"

          git push
