name: Actualizar lanzamientos

on:
  schedule:
    - cron: "30 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  actualizar-lanzamientos:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      - name: Instalar dependencias
        run: |
          pip install requests


      - name: Descargar próximos lanzamientos de GOG
        run: |

          python <<'PY'

          import json
          import requests
          from datetime import datetime, date


          print("====================================")
          print("ACTUALIZANDO LANZAMIENTOS DE GOG")
          print("====================================")


          # =========================================================
          # CONFIGURACIÓN
          # =========================================================

          URL = (
              "https://catalog.gog.com/v1/catalog"
              "?limit=100"
              "&order=asc%3AreleaseDate"
              "&productType=in%3Agame"
              "&countryCode=ES"
              "&locale=es-ES"
              "&currencyCode=EUR"
              "&page=1"
          )


          # =========================================================
          # GÉNEROS QUE NOS INTERESAN
          # =========================================================

          GENEROS_VALIDOS = {

              "adventure",
              "adventures",

              "graphic adventure",
              "graphic adventures",

              "point & click",
              "point and click",

              "visual novel",
              "visual novels",

              "walking simulator",
              "walking simulators",

              "interactive fiction",

              "narrative",

              "narrative adventure",

              "story rich"

          }


          # =========================================================
          # FUNCIÓN PARA NORMALIZAR TEXTO
          # =========================================================

          def normalizar(texto):

              if texto is None:
                  return ""

              return (
                  str(texto)
                  .strip()
                  .lower()
                  .replace("-", " ")
              )


          # =========================================================
          # DESCARGAR CATÁLOGO
          # =========================================================

          print("")
          print("Descargando catálogo de GOG...")
          print(URL)


          respuesta = requests.get(
              URL,
              headers={
                  "User-Agent":
                      "Mozilla/5.0"
              },
              timeout=30
          )


          print(
              "Código HTTP:",
              respuesta.status_code
          )


          respuesta.raise_for_status()


          datos = respuesta.json()


          print("")
          print("Catálogo descargado correctamente.")


          # =========================================================
          # EXTRAER PRODUCTOS
          # =========================================================

          productos = []


          if isinstance(datos, dict):

              if isinstance(
                  datos.get("products"),
                  list
              ):

                  productos = datos["products"]


              elif isinstance(
                  datos.get("_embedded"),
                  dict
              ):

                  productos = (
                      datos["_embedded"]
                      .get(
                          "products",
                          []
                      )
                  )


          print(
              "Productos recibidos:",
              len(productos)
          )


          # =========================================================
          # FECHA ACTUAL
          # =========================================================

          hoy = date.today()


          # =========================================================
          # BUSCAR PRODUCTOS RELEVANTES
          # =========================================================

          resultados = []


          for producto in productos:

              titulo = (
                  producto.get(
                      "title",
                      ""
                  )
                  .strip()
              )


              if not titulo:
                  continue


              # -----------------------------------------------------
              # FECHA
              # -----------------------------------------------------

              fecha = producto.get(
                  "releaseDate"
              )


              if not fecha:
                  continue


              fecha_texto = str(
                  fecha
              )[:10]


              try:

                  fecha_obj = (
                      datetime.strptime(
                          fecha_texto,
                          "%Y-%m-%d"
                      ).date()
                  )

              except Exception:

                  continue


              # Solo próximos lanzamientos
              if fecha_obj < hoy:
                  continue


              # -----------------------------------------------------
              # GÉNEROS
              # -----------------------------------------------------

              generos = producto.get(
                  "genres",
                  []
              )


              tags = producto.get(
                  "tags",
                  []
              )


              nombres_generos = []


              if isinstance(
                  generos,
                  list
              ):

                  for genero in generos:

                      if isinstance(
                          genero,
                          dict
                      ):

                          nombre = (
                              genero.get(
                                  "name",
                                  ""
                              )
                          )

                          if nombre:
                              nombres_generos.append(
                                  normalizar(
                                      nombre
                                  )
                              )

                      elif isinstance(
                          genero,
                          str
                      ):

                          nombres_generos.append(
                              normalizar(
                                  genero
                              )
                          )


              if isinstance(
                  tags,
                  list
              ):

                  for tag in tags:

                      if isinstance(
                          tag,
                          dict
                      ):

                          nombre = (
                              tag.get(
                                  "name",
                                  ""
                              )
                          )

                          if nombre:
                              nombres_generos.append(
                                  normalizar(
                                      nombre
                                  )
                              )

                      elif isinstance(
                          tag,
                          str
                      ):

                          nombres_generos.append(
                              normalizar(
                                  tag
                              )
                          )


              # -----------------------------------------------------
              # COMPROBAR SI ES DEL TIPO QUE BUSCAMOS
              # -----------------------------------------------------

              coincidencias = []


              for genero in nombres_generos:

                  if genero in GENEROS_VALIDOS:

                      coincidencias.append(
                          genero
                      )


              if not coincidencias:
                  continue


              # -----------------------------------------------------
              # ID
              # -----------------------------------------------------

              producto_id = producto.get(
                  "id"
              )


              if not producto_id:
                  continue


              # -----------------------------------------------------
              # SLUG
              # -----------------------------------------------------

              slug = producto.get(
                  "slug",
                  ""
              )


              # -----------------------------------------------------
              # ENLACE
              # -----------------------------------------------------

              if slug:

                  enlace = (
                      "https://www.gog.com/game/"
                      + slug
                  )

              else:

                  enlace = ""


              # -----------------------------------------------------
              # IMAGEN
              # -----------------------------------------------------

              imagen = ""


              images = producto.get(
                  "images",
                  {}
              )


              if isinstance(
                  images,
                  dict
              ):

                  imagen = (
                      images.get(
                          "logo2x",
                          ""
                      )
                      or
                      images.get(
                          "logo",
                          ""
                      )
                      or
                      images.get(
                          "icon",
                          ""
                      )
                  )


              # Algunas respuestas pueden devolver
              # la imagen directamente como campo.

              if not imagen:

                  imagen = (
                      producto.get(
                          "image",
                          ""
                      )
                      or
                      producto.get(
                          "imageUrl",
                          ""
                      )
                  )


              if imagen.startswith("//"):

                  imagen = (
                      "https:"
                      + imagen
                  )


              # -----------------------------------------------------
              # GUARDAR RESULTADO
              # -----------------------------------------------------

              resultados.append({

                  "title":
                      titulo,

                  "link":
                      enlace,

                  "image":
                      imagen,

                  "releaseDate":
                      fecha_texto,

                  "category":
                      "GOG"

              })


              print("")
              print(
                  "ENCONTRADO:",
                  titulo
              )

              print(
                  "Fecha:",
                  fecha_texto
              )

              print(
                  "Género:",
                  ", ".join(
                      coincidencias
                  )
              )

              print(
                  "Imagen:",
                  "SÍ"
                  if imagen
                  else "NO"
              )


          # =========================================================
          # ELIMINAR DUPLICADOS
          # =========================================================

          unicos = []


          vistos = set()


          for producto in resultados:

              clave = (
                  producto["title"]
                  .strip()
                  .lower()
              )


              if clave in vistos:
                  continue


              vistos.add(
                  clave
              )


              unicos.append(
                  producto
              )


          # =========================================================
          # ORDENAR POR FECHA
          # =========================================================

          unicos.sort(
              key=lambda producto:
                  producto.get(
                      "releaseDate",
                      "9999-99-99"
                  )
          )


          # =========================================================
          # MÁXIMO 12
          # =========================================================

          unicos = unicos[:12]


          # =========================================================
          # GUARDAR JSON
          # =========================================================

          with open(
              "proximos.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  unicos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # RESULTADO
          # =========================================================

          print("")
          print("====================================")
          print("RESULTADO")
          print("====================================")

          print(
              "Lanzamientos guardados:",
              len(unicos)
          )

          print("")

          for producto in unicos:

              print(
                  "-",
                  producto["title"],
                  "|",
                  producto["releaseDate"]
              )


          print("")
          print(
              "Archivo generado: proximos.json"
          )

          print("====================================")

          PY


      - name: Comprobar proximos.json
        run: |

          echo "===================================="
          echo "CONTENIDO DE proximos.json"
          echo "===================================="

          cat proximos.json

          echo ""

          echo "===================================="


      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proximos.json

          git diff --cached --quiet || git commit -m "Actualizar próximos lanzamientos"

          git push
