name: Actualizar lanzamientos

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  actualizar-lanzamientos:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # DESCARGAR REPOSITORIO
      # =========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # =========================================================
      # CONFIGURAR PYTHON
      # =========================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # =========================================================
      # INSTALAR DEPENDENCIAS
      # =========================================================

      - name: Instalar dependencias
        run: |
          pip install requests


      # =========================================================
      # OBTENER PRÓXIMOS LANZAMIENTOS
      # =========================================================

      - name: Obtener próximos lanzamientos de GOG
        run: |

          python <<'PY'

          import json
          import requests
          from datetime import datetime, timezone


          print("====================================")
          print("ACTUALIZANDO PRÓXIMOS LANZAMIENTOS")
          print("====================================")


          # =========================================================
          # FECHA ACTUAL
          # =========================================================

          hoy = datetime.now(timezone.utc).date()

          print("")
          print("Fecha actual:", hoy)


          # =========================================================
          # PALABRAS CLAVE
          # =========================================================

          PALABRAS_CLAVE = [

              "point & click",
              "point and click",
              "point-and-click",

              "graphic adventure",
              "graphic adventures",

              "visual novel",
              "visual novels",

              "walking simulator",
              "walking simulators",

              "narrative adventure",
              "narrative adventures",

              "story rich"

          ]


          # =========================================================
          # EXCLUSIONES
          # =========================================================

          EXCLUSIONES = [

              "first-person shooter",
              "third-person shooter",

              "battle royale",

              "racing",

              "sports",

              "strategy",
              "real-time strategy",

              "rpg",
              "role-playing",

              "fighting",

              "platformer"

          ]


          # =========================================================
          # LISTA FINAL
          # =========================================================

          juegos = []


          # =========================================================
          # EVITAR DUPLICADOS
          # =========================================================

          ids_procesados = set()


          # =========================================================
          # CONSULTAR VARIAS PÁGINAS
          # =========================================================

          MAX_PAGINAS = 5


          for pagina in range(1, MAX_PAGINAS + 1):


              URL = (
                  "https://catalog.gog.com/v1/catalog"
                  "?limit=100"
                  "&releaseStatuses=in%3Aupcoming"
                  "&order=asc%3AreleaseDate"
                  "&productType=in%3Agame"
                  f"&page={pagina}"
              )


              print("")
              print("====================================")
              print("CONSULTANDO PÁGINA", pagina)
              print("====================================")

              print(URL)


              try:

                  respuesta = requests.get(
                      URL,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      },
                      timeout=30
                  )

                  respuesta.raise_for_status()

                  datos = respuesta.json()

              except Exception as error:

                  print(
                      "ERROR consultando página:",
                      pagina,
                      error
                  )

                  continue


              productos = datos.get(
                  "products",
                  []
              )


              print(
                  "Productos encontrados:",
                  len(productos)
              )


              if not productos:
                  break


              # =====================================================
              # PROCESAR PRODUCTOS
              # =====================================================

              for producto in productos:


                  titulo = str(
                      producto.get(
                          "title",
                          ""
                      )
                  ).strip()


                  if not titulo:
                      continue


                  producto_id = str(
                      producto.get(
                          "id",
                          ""
                      )
                  )


                  if producto_id in ids_procesados:
                      continue


                  ids_procesados.add(
                      producto_id
                  )


                  # =================================================
                  # TEXTO PARA BUSCAR CATEGORÍAS
                  # =================================================

                  texto = json.dumps(
                      producto,
                      ensure_ascii=False
                  ).lower()


                  # =================================================
                  # EXCLUSIONES
                  # =================================================

                  exclusion_encontrada = None


                  for exclusion in EXCLUSIONES:

                      if exclusion in texto:

                          exclusion_encontrada = exclusion

                          break


                  if exclusion_encontrada:

                      print(
                          "Excluido:",
                          titulo,
                          "->",
                          exclusion_encontrada
                      )

                      continue


                  # =================================================
                  # FILTRO TEMÁTICO
                  # =================================================

                  coincide = False


                  for palabra in PALABRAS_CLAVE:

                      if palabra in texto:

                          coincide = True

                          break


                  if not coincide:

                      continue


                  # =================================================
                  # FECHA
                  # =================================================

                  fecha = (

                      producto.get(
                          "releaseDate"
                      )

                      or

                      producto.get(
                          "storeReleaseDate"
                      )

                      or

                      ""
                  ).strip()


                  # =================================================
                  # SOLO ACEPTAR JUEGOS CON FECHA
                  # =================================================

                  if not fecha:

                      print(
                          "Descartado por no tener fecha:",
                          titulo
                      )

                      continue


                  # =================================================
                  # COMPROBAR FECHA
                  # =================================================

                  try:

                      fecha_valida = datetime.strptime(
                          fecha,
                          "%Y.%m.%d"
                      ).date()

                  except ValueError:

                      print(
                          "Descartado por fecha no reconocida:",
                          titulo,
                          fecha
                      )

                      continue


                  # =================================================
                  # DESCARTAR LANZAMIENTOS PASADOS
                  # =================================================

                  if fecha_valida < hoy:

                      print(
                          "Descartado por fecha pasada:",
                          titulo,
                          fecha
                      )

                      continue


                  # =================================================
                  # ENLACE
                  # =================================================

                  enlace = str(
                      producto.get(
                          "storeLink",
                          ""
                      )
                  ).strip()


                  # =================================================
                  # IMAGEN
                  # =================================================

                  imagen = str(
                      producto.get(
                          "coverVertical",
                          ""
                      )
                  ).strip()


                  # =================================================
                  # SI NO HAY IMAGEN VERTICAL,
                  # USAMOS HORIZONTAL
                  # =================================================

                  if not imagen:

                      imagen = str(
                          producto.get(
                              "coverHorizontal",
                              ""
                          )
                      ).strip()


                  # =================================================
                  # GUARDAR
                  # =================================================

                  juego = {

                      "title":
                          titulo,

                      "link":
                          enlace,

                      "image":
                          imagen,

                      "releaseDate":
                          fecha,

                      "category":
                          "GOG"

                  }


                  juegos.append(
                      juego
                  )


                  print("")
                  print("--------------------------------")
                  print("ENCONTRADO:", titulo)
                  print("Imagen:", imagen)
                  print("Enlace:", enlace)
                  print("Fecha:", fecha)
                  print("--------------------------------")


          # =========================================================
          # ORDENAR RESULTADOS
          # =========================================================

          def fecha_orden(juego):

              fecha = juego.get(
                  "releaseDate",
                  ""
              )


              try:

                  fecha_dt = datetime.strptime(
                      fecha,
                      "%Y.%m.%d"
                  ).date()


                  return (
                      0,
                      fecha_dt.isoformat()
                  )

              except ValueError:

                  return (
                      1,
                      "9999.99.99"
                  )


          juegos.sort(
              key=fecha_orden
          )


          # =========================================================
          # ELIMINAR DUPLICADOS POR TÍTULO
          # =========================================================

          juegos_unicos = []

          titulos_vistos = set()


          for juego in juegos:

              clave = juego["title"].lower().strip()


              if clave in titulos_vistos:
                  continue


              titulos_vistos.add(
                  clave
              )


              juegos_unicos.append(
                  juego
              )


          juegos = juegos_unicos


          # =========================================================
          # LIMITAR A 12
          # =========================================================

          juegos = juegos[:12]


          # =========================================================
          # GUARDAR JSON
          # =========================================================

          with open(
              "proximos.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  juegos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # RESULTADO
          # =========================================================

          print("")
          print("====================================")
          print("RESULTADO FINAL")
          print("====================================")

          print(
              "Fecha actual:",
              hoy
          )

          print(
              "Juegos seleccionados:",
              len(juegos)
          )

          print(
              "Archivo generado: proximos.json"
          )

          print("")


          for juego in juegos:

              print(
                  "--------------------------------"
              )

              print(
                  "Título:",
                  juego["title"]
              )

              print(
                  "Fecha:",
                  juego["releaseDate"]
              )

              print(
                  "Imagen:",
                  juego["image"]
              )

              print(
                  "Enlace:",
                  juego["link"]
              )


          print("")
          print("====================================")

          PY


      # =========================================================
      # COMPROBAR JSON
      # =========================================================

      - name: Comprobar proximos.json
        run: |

          echo "===================================="
          echo "CONTENIDO DE proximos.json"
          echo "===================================="

          cat proximos.json

          echo ""
          echo "===================================="


      # =========================================================
      # GUARDAR CAMBIOS EN GITHUB
      # =========================================================

      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proximos.json

          git diff --cached --quiet || git commit -m "Actualizar próximos lanzamientos"

          git push
