name: Actualizar lanzamientos

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lanzamientos:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # DESCARGAR REPOSITORIO
      # =========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # =========================================================
      # PYTHON
      # =========================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # =========================================================
      # DEPENDENCIAS
      # =========================================================

      - name: Instalar dependencias
        run: |
          pip install requests


      # =========================================================
      # OBTENER PRÓXIMOS LANZAMIENTOS
      # =========================================================

      - name: Obtener próximos lanzamientos de GOG
        run: |

          python <<'PY'

          import json
          import requests
          from datetime import datetime


          print("====================================")
          print("ACTUALIZANDO PRÓXIMOS LANZAMIENTOS")
          print("====================================")


          # =========================================================
          # CONFIGURACIÓN
          # =========================================================

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept": "application/json"
          }


          # =========================================================
          # CATÁLOGO DE GOG
          # =========================================================

          URL = (
              "https://catalog.gog.com/v1/catalog"
              "?limit=100"
              "&releaseStatuses=in%3Aupcoming"
              "&order=asc%3AreleaseDate"
              "&productType=in%3Agame"
              "&page=1"
          )


          print("")
          print("Consultando catálogo de GOG...")
          print(URL)


          respuesta = requests.get(
              URL,
              headers=HEADERS,
              timeout=30
          )


          respuesta.raise_for_status()


          datos = respuesta.json()


          print("")
          print(
              "Código HTTP:",
              respuesta.status_code
          )


          # =========================================================
          # PRODUCTOS
          # =========================================================

          productos = datos.get(
              "products",
              []
          )


          print(
              "Productos encontrados:",
              len(productos)
          )


          # =========================================================
          # DIAGNÓSTICO
          # =========================================================

          if productos:

              print("")
              print("====================================")
              print("EJEMPLO DE PRODUCTO GOG")
              print("====================================")

              print(
                  json.dumps(
                      productos[0],
                      ensure_ascii=False,
                      indent=2
                  )
              )

              print("====================================")


          # =========================================================
          # PALABRAS CLAVE
          #
          # SOLO queremos:
          #
          # - Point & Click
          # - Aventuras gráficas
          # - Visual Novels
          # - Walking Simulators
          # - Narrative Adventures
          #
          # No usamos "terror", "misterio", "story rich", etc.
          # porque podrían introducir géneros que no queremos.
          # =========================================================

          PALABRAS_CLAVE = [

              "point & click",
              "point and click",
              "point-and-click",

              "graphic adventure",
              "graphic adventures",

              "visual novel",
              "visual novels",

              "walking simulator",
              "walking simulators",

              "narrative adventure",
              "narrative adventures"

          ]


          # =========================================================
          # EXCLUSIONES
          # =========================================================

          EXCLUSIONES = [

              "first-person shooter",
              "first person shooter",

              "third-person shooter",
              "third person shooter",

              "fps",
              "shooter",

              "battle royale",

              "racing",
              "sports",

              "strategy",
              "real-time strategy",

              "rpg",
              "role-playing",
              "role playing",

              "fighting",

              "platformer"

          ]


          # =========================================================
          # FECHA ACTUAL
          # =========================================================

          HOY = datetime.utcnow().date()


          # =========================================================
          # FUNCIONES AUXILIARES
          # =========================================================

          def obtener_fecha(valor):

              if not valor:
                  return None

              valor = str(valor).strip()

              formatos = [
                  "%Y-%m-%d",
                  "%Y.%m.%d",
                  "%Y/%m/%d",
                  "%Y-%m-%dT%H:%M:%S",
                  "%Y-%m-%dT%H:%M:%SZ"
              ]

              for formato in formatos:

                  try:

                      return datetime.strptime(
                          valor[:19],
                          formato
                      ).date()

                  except ValueError:
                      pass

              return None


          def buscar_url(objeto, claves):

              """
              Busca recursivamente una URL en un JSON
              usando distintos nombres de campo.
              """

              if isinstance(objeto, dict):

                  for clave in claves:

                      valor = objeto.get(clave)

                      if isinstance(valor, str):

                          if valor.startswith(
                              "http://"
                          ) or valor.startswith(
                              "https://"
                          ):

                              return valor


                  for valor in objeto.values():

                      resultado = buscar_url(
                          valor,
                          claves
                      )

                      if resultado:
                          return resultado


              elif isinstance(objeto, list):

                  for elemento in objeto:

                      resultado = buscar_url(
                          elemento,
                          claves
                      )

                      if resultado:
                          return resultado


              return ""


          # =========================================================
          # RESULTADOS
          # =========================================================

          juegos = []


          # =========================================================
          # PROCESAR PRODUCTOS
          # =========================================================

          for producto in productos:

              titulo = str(
                  producto.get(
                      "title",
                      ""
                  )
              ).strip()


              if not titulo:
                  continue


              # -----------------------------------------------------
              # TEXTO COMPLETO DEL PRODUCTO
              # -----------------------------------------------------

              texto = json.dumps(
                  producto,
                  ensure_ascii=False
              ).lower()


              # -----------------------------------------------------
              # EXCLUSIONES
              # -----------------------------------------------------

              if any(
                  exclusion in texto
                  for exclusion in EXCLUSIONES
              ):

                  print(
                      "Excluido:",
                      titulo
                  )

                  continue


              # -----------------------------------------------------
              # FILTRO TEMÁTICO
              # -----------------------------------------------------

              coincide = any(
                  palabra in texto
                  for palabra in PALABRAS_CLAVE
              )


              if not coincide:
                  continue


              # -----------------------------------------------------
              # ID DEL PRODUCTO
              # -----------------------------------------------------

              product_id = (
                  producto.get("id")
                  or
                  producto.get("externalProductId")
              )


              if not product_id:

                  print(
                      "Sin ID:",
                      titulo
                  )

                  continue


              print("")
              print("--------------------------------")
              print("Encontrado:", titulo)
              print("ID:", product_id)


              # =====================================================
              # FECHA DEL CATÁLOGO
              # =====================================================

              fecha = (
                  producto.get(
                      "releaseDate"
                  )
                  or
                  producto.get(
                      "release_date"
                  )
                  or
                  ""
              )


              # -----------------------------------------------------
              # DESCARTAR FECHAS PASADAS
              # -----------------------------------------------------

              fecha_convertida = obtener_fecha(
                  fecha
              )


              if (
                  fecha_convertida
                  and
                  fecha_convertida < HOY
              ):

                  print(
                      "Descartado por fecha pasada:",
                      fecha
                  )

                  continue


              # =====================================================
              # CONSULTAR API DE DETALLE DE GOG
              # =====================================================

              detalle = {}


              detalle_url = (
                  "https://api.gog.com/v2/games/"
                  + str(product_id)
                  + "?locale=en-US"
              )


              try:

                  print(
                      "Consultando detalle:"
                  )

                  print(
                      detalle_url
                  )


                  respuesta_detalle = requests.get(
                      detalle_url,
                      headers=HEADERS,
                      timeout=30
                  )


                  if respuesta_detalle.status_code == 200:

                      detalle = (
                          respuesta_detalle.json()
                      )

                      print(
                          "Detalle obtenido correctamente."
                      )

                  else:

                      print(
                          "Detalle HTTP:",
                          respuesta_detalle.status_code
                      )


              except Exception as error:

                  print(
                      "Error obteniendo detalle:",
                      error
                  )


              # =====================================================
              # ENLACE
              # =====================================================

              enlace = ""


              # Primero intentamos encontrar los enlaces
              # habituales del API v2.

              enlace = buscar_url(
                  detalle,
                  [
                      "store",
                      "productCard",
                      "product_card",
                      "productCardUrl",
                      "storeUrl"
                  ]
              )


              # Si no aparece, usamos el catálogo.

              if not enlace:

                  enlace = buscar_url(
                      producto,
                      [
                          "store",
                          "productCard",
                          "product_card",
                          "productCardUrl",
                          "storeUrl"
                      ]
                  )


              # =====================================================
              # IMAGEN
              # =====================================================

              imagen = ""


              # Intentar boxArtImage primero.

              imagen = buscar_url(
                  detalle,
                  [
                      "boxArtImage",
                      "boxartImage",
                      "boxArt",
                      "boxart"
                  ]
              )


              # Si GOG no lo proporciona, buscamos otras
              # estructuras de imágenes.

              if not imagen:

                  imagen = buscar_url(
                      detalle,
                      [
                          "image_url",
                          "imageUrl",
                          "formatter_template_url",
                          "formatterTemplateUrl",
                          "backgroundImage"
                      ]
                  )


              # =====================================================
              # FECHA DEL DETALLE
              # =====================================================

              fecha_detalle = (
                  detalle.get(
                      "releaseDate"
                  )
                  or
                  detalle.get(
                      "release_date"
                  )
                  or
                  ""
              )


              if fecha_detalle:

                  fecha = fecha_detalle


              # =====================================================
              # EVITAR DUPLICADOS
              # =====================================================

              if any(
                  juego["title"].lower()
                  == titulo.lower()
                  for juego in juegos
              ):

                  continue


              # =====================================================
              # GUARDAR
              # =====================================================

              juegos.append({

                  "title":
                      titulo,

                  "link":
                      enlace,

                  "image":
                      imagen,

                  "releaseDate":
                      fecha,

                  "category":
                      "GOG"

              })


              print(
                  "Imagen:",
                  imagen
              )

              print(
                  "Enlace:",
                  enlace
              )

              print(
                  "Fecha:",
                  fecha
              )


              # =====================================================
              # NO NECESITAMOS SEGUIR BUSCANDO
              # UNA VEZ QUE TENEMOS 12.
              # =====================================================

              if len(juegos) >= 12:
                  break


          # =========================================================
          # GUARDAR JSON
          # =========================================================

          with open(
              "proximos.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  juegos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # RESULTADO
          # =========================================================

          print("")
          print("====================================")
          print("RESULTADO")
          print("====================================")

          print(
              "Juegos seleccionados:",
              len(juegos)
          )

          print(
              "Archivo generado: proximos.json"
          )


          print("")


          for juego in juegos:

              print(
                  "--------------------------------"
              )

              print(
                  "Título:",
                  juego["title"]
              )

              print(
                  "Fecha:",
                  juego["releaseDate"]
              )

              print(
                  "Imagen:",
                  juego["image"]
              )

              print(
                  "Enlace:",
                  juego["link"]
              )


          print("")
          print("====================================")

          PY


      # =========================================================
      # COMPROBAR JSON
      # =========================================================

      - name: Comprobar proximos.json
        run: |

          echo "===================================="
          echo "CONTENIDO DE proximos.json"
          echo "===================================="

          cat proximos.json

          echo ""
          echo "===================================="


      # =========================================================
      # GUARDAR CAMBIOS
      # =========================================================

      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proximos.json

          git diff --cached --quiet || git commit -m "Actualizar próximos lanzamientos"

          git push
