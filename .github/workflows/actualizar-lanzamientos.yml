name: Actualizar lanzamientos

on:
  schedule:
    - cron: "30 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  actualizar-lanzamientos:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      - name: Instalar dependencias
        run: |
          pip install requests


      - name: Obtener próximos lanzamientos de GOG
        run: |

          python <<'PY'

          import json
          import requests
          from datetime import datetime


          print("====================================")
          print("ACTUALIZANDO LANZAMIENTOS DE GOG")
          print("====================================")


          # =========================================================
          # CONFIGURACIÓN
          # =========================================================

          CATALOG_URL = (
              "https://catalog.gog.com/v1/catalog"
              "?limit=48"
              "&order=asc%3AreleaseDate"
              "&productType=in%3Agame"
              "&countryCode=ES"
              "&locale=es-ES"
              "&currencyCode=EUR"
          )


          # =========================================================
          # PALABRAS CLAVE
          # =========================================================
          #
          # IMPORTANTE:
          # Aquí solamente buscamos géneros claramente relacionados
          # con Invasión Pixelada.
          #
          # No incluimos terror, misterio, ciencia ficción, etc.
          # porque pueden devolver FPS, acción u otros géneros.
          #

          PALABRAS_CLAVE = [

              "adventure",

              "point & click",
              "point and click",
              "point-and-click",

              "graphic adventure",
              "graphic adventures",

              "visual novel",
              "visual novels",

              "walking simulator",
              "walking simulators",

              "interactive fiction",

              "narrative",

              "narrative adventure",

              "story rich"

          ]


          # =========================================================
          # DESCARGAR CATÁLOGO
          # =========================================================

          print("")
          print("Descargando catálogo de GOG...")
          print(CATALOG_URL)


          respuesta = requests.get(
              CATALOG_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=30
          )


          respuesta.raise_for_status()


          datos = respuesta.json()


          print("")
          print("Catálogo descargado correctamente.")


          # =========================================================
          # LOCALIZAR PRODUCTOS
          # =========================================================

          productos = []


          if isinstance(datos, dict):

              if "products" in datos:
                  productos = datos["products"]

              elif "_embedded" in datos:

                  embedded = datos["_embedded"]

                  if isinstance(embedded, dict):

                      productos = embedded.get(
                          "products",
                          []
                      )


          print(
              "Productos encontrados:",
              len(productos)
          )


          # =========================================================
          # FECHA ACTUAL
          # =========================================================

          hoy = datetime.utcnow().date()


          # =========================================================
          # FILTRAR PRODUCTOS
          # =========================================================

          candidatos = []


          for producto in productos:

              titulo = str(
                  producto.get(
                      "title",
                      ""
                  )
              ).strip()


              if not titulo:
                  continue


              # -----------------------------------------------------
              # Fecha
              # -----------------------------------------------------

              fecha = producto.get(
                  "releaseDate",
                  producto.get(
                      "release_date",
                      ""
                  )
              )


              if not fecha:
                  continue


              fecha_limpia = str(
                  fecha
              )[:10]


              try:

                  fecha_obj = datetime.strptime(
                      fecha_limpia,
                      "%Y-%m-%d"
                  ).date()

              except Exception:

                  continue


              # Solamente próximos lanzamientos
              if fecha_obj < hoy:
                  continue


              # -----------------------------------------------------
              # Convertimos el producto entero en texto
              # -----------------------------------------------------

              texto = json.dumps(
                  producto,
                  ensure_ascii=False
              ).lower()


              # -----------------------------------------------------
              # Buscar coincidencias
              # -----------------------------------------------------

              coincidencias = []


              for palabra in PALABRAS_CLAVE:

                  if palabra.lower() in texto:

                      coincidencias.append(
                          palabra
                      )


              if not coincidencias:
                  continue


              # -----------------------------------------------------
              # ID DEL PRODUCTO
              # -----------------------------------------------------

              producto_id = producto.get(
                  "id"
              )


              if not producto_id:
                  continue


              candidatos.append({

                  "id": str(
                      producto_id
                  ),

                  "title": titulo,

                  "releaseDate": fecha_limpia,

                  "coincidencias":
                      coincidencias

              })


          print("")
          print(
              "Candidatos encontrados:",
              len(candidatos)
          )


          # =========================================================
          # CONSULTAR INFORMACIÓN DETALLADA
          # =========================================================

          resultados = []


          for candidato in candidatos[:30]:

              producto_id = candidato["id"]


              print(
                  "",
                  "Consultando:",
                  candidato["title"],
                  "(",
                  producto_id,
                  ")"
              )


              url_producto = (
                  "https://api.gog.com/products/"
                  + producto_id
                  + "?locale=en_US"
              )


              try:

                  respuesta_producto = requests.get(
                      url_producto,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      },
                      timeout=30
                  )


                  if respuesta_producto.status_code != 200:

                      print(
                          "  Error HTTP:",
                          respuesta_producto.status_code
                      )

                      continue


                  detalle = (
                      respuesta_producto.json()
                  )


              except Exception as error:

                  print(
                      "  Error:",
                      error
                  )

                  continue


              # =====================================================
              # IMAGEN
              # =====================================================

              imagen = ""


              imagenes = detalle.get(
                  "images",
                  {}
              )


              if isinstance(imagenes, dict):

                  imagen = (
                      imagenes.get(
                          "logo2x"
                      )
                      or
                      imagenes.get(
                          "logo"
                      )
                      or
                      imagenes.get(
                          "background"
                      )
                      or
                      imagenes.get(
                          "icon"
                      )
                      or
                      ""
                  )


              # GOG puede devolver URLs que empiezan por //
              if imagen.startswith("//"):

                  imagen = (
                      "https:"
                      + imagen
                  )


              # =====================================================
              # ENLACE
              # =====================================================

              enlace = ""


              links = detalle.get(
                  "links",
                  {}
              )


              if isinstance(links, dict):

                  enlace = (
                      links.get(
                          "product_card",
                          ""
                      )
                  )


              # Si no existe, construimos la URL usando el slug
              if not enlace:

                  slug = detalle.get(
                      "slug",
                      ""
                  )


                  if slug:

                      enlace = (
                          "https://www.gog.com/game/"
                          + slug
                      )


              # =====================================================
              # FECHA
              # =====================================================

              fecha = detalle.get(
                  "release_date",
                  candidato["releaseDate"]
              )


              if fecha:

                  fecha = str(
                      fecha
                  )[:10]


              # =====================================================
              # RESULTADO
              # =====================================================

              resultados.append({

                  "title":
                      detalle.get(
                          "title",
                          candidato["title"]
                      ),

                  "link":
                      enlace,

                  "image":
                      imagen,

                  "releaseDate":
                      fecha,

                  "category":
                      "GOG"

              })


          # =========================================================
          # ELIMINAR DUPLICADOS
          # =========================================================

          finales = []


          vistos = set()


          for noticia in resultados:

              clave = (
                  noticia["title"].lower()
              )


              if clave in vistos:
                  continue


              vistos.add(
                  clave
              )


              finales.append(
                  noticia
              )


          # =========================================================
          # ORDENAR POR FECHA
          # =========================================================

          finales.sort(
              key=lambda x:
                  x.get(
                      "releaseDate",
                      "9999-99-99"
                  )
          )


          # Nos quedamos con 12
          finales = finales[:12]


          # =========================================================
          # GUARDAR JSON
          # =========================================================

          with open(
              "proximos.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  finales,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("====================================")
          print("RESULTADO")
          print("====================================")


          print(
              "Lanzamientos guardados:",
              len(finales)
          )


          for lanzamiento in finales:

              print(
                  "-",
                  lanzamiento["title"],
                  "|",
                  lanzamiento["releaseDate"],
                  "|",
                  "imagen:",
                  bool(
                      lanzamiento["image"]
                  )
              )


          print("")
          print(
              "Archivo generado: proximos.json"
          )

          print("====================================")

          PY


      - name: Comprobar proximos.json
        run: |

          echo "===================================="
          echo "CONTENIDO DE proximos.json"
          echo "===================================="

          cat proximos.json

          echo ""


      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proximos.json

          git diff --cached --quiet || git commit -m "Actualizar próximos lanzamientos"

          git push
